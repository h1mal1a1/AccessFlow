services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: access-flow-backend
    ports:
      - "8080:8080"
    env_file:
      - .env.backend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - accessflow-network

  db:
    image: postgres:18
    container_name: access-flow-pg
    env_file:
      - .env.db
    volumes:
      - ./pg/data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d access_flow_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - accessflow-network

networks:
  accessflow-network:
